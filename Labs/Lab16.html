<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Validation</title>
    <style>
        .rule{
            display: none;
        }
        .invalid{
            display: contents;
            color: red;
        }
        .valid{
            display: none;
        }
    </style>
</head>
<body>
    <form action="#">
        <label for="name">Enter your name:</label>
        <input type="text" id="name" required><br>
        <label for="email">Enter your email:</label>
        <input type="email" id="email" required><br>
        <label for="pw">Create a password:</label>
        <input type="password" id="pw" required><br>
        <div class="rules" id="password-rules">
            <div id="rule-length" class="rule">✖ At least 6 characters<br></div>
            <div id="rule-special" class="rule">✖ Must include a special character (!@#$...)<br></div>
            <div id="rule-uppercase" class="rule">✖ Must include an uppercase letter (A-Z)<br></div>
        </div>
        <button id="formsubmit">Submit</button>
    </form>
    <script>
        const formsubmit = document.getElementById('formsubmit');
        formsubmit.addEventListener('submit', ()=>{
            event.preventDefault();
        })
        
        const pw = document.getElementById('pw');
        pw.addEventListener('input', ()=>{
            const typed_pw = pw.value;
            const rule_length = document.getElementById('rule-length');
            const rule_special = document.getElementById('rule-special');
            const rule_upper = document.getElementById('rule-uppercase');
            const pw_length = typed_pw.length >= 6;
            const pw_special = /[!@#$%^&*(),.?":{}|<>]/.test(typed_pw);
            const pw_uppercase = /[A-Z]/.test(typed_pw);

            rule_length.classList.toggle('invalid', !pw_length);
            rule_length.classList.toggle('valid', pw_length);
            
            rule_special.classList.toggle('invalid', !pw_special);
            rule_special.classList.toggle('valid', pw_special);

            rule_upper.classList.toggle('invalid', !pw_uppercase);
            rule_upper.classList.toggle('valid', pw_uppercase);
        });
    </script>
</body>
</html>
